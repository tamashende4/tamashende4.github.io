<!DOCTYPE html>
<html>

<head>
  <title>Screen</title>
</head>
<style>
  * {
    background-color: black;
    cursor: default;
  }
  html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
</style>

<body>
<script>
document.addEventListener("click", ({ ctrlKey }) => {
    if (!ctrlKey) return;

    if (document.fullscreenElement) {
        document.exitFullscreen();
    } else {
        document.documentElement.requestFullscreen();
    }
});
  </script>
</body>

</html>
